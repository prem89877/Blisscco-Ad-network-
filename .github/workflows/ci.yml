name: CI

# Har push / pull request par: type check, tests, ESLint, production build.
# Koi bhi check fail ho toh job laal (fail) hoga. Koi step skip hone par "passed" nahi dikhaya jata.
# Node version .nvmrc se aati hai (package.json engines se mel khati hai); install sirf package-lock.json se (`npm ci`).
# Secrets ya asli Supabase credentials yahan use nahi hote (build ke liye sirf dummy values).
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # Reproducible install: sirf `npm ci` (package-lock.json se exact versions). Lockfile missing ya package.json se
      # mismatch ho toh yeh step fail hoga; `npm install` fallback nahi hai, taaki CI kabhi chupke se alag versions na le.
      - name: Install (npm ci, lockfile only)
        run: npm ci

      - name: Installed versions (next, react)
        run: npm ls next react react-dom

      # Neeche ke checks `!cancelled()` se chalte hain: ek fail hone par bhi baaki chalte hain,
      # taaki saari asli failures ek hi run me dikhein. Job phir bhi fail rehta hai.
      # Shell script (scripts/backup-production-db.sh): sirf syntax check, script chalti nahi (database/secret ki zaroorat nahi).
      - name: Shell script syntax (bash -n)
        run: bash -n scripts/backup-production-db.sh

      - name: Type check (npm run lint = tsc --noEmit)
        run: npm run lint

      - name: Tests (npm test)
        if: ${{ !cancelled() }}
        run: npm test

      - name: ESLint (npm run lint:eslint)
        if: ${{ !cancelled() }}
        run: npm run lint:eslint

      - name: Production build (npm run build)
        if: ${{ !cancelled() }}
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_dummy
          SUPABASE_SECRET_KEY: sb_secret_dummy
