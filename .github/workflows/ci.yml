name: CI

# Har push / pull request par: scripts/day28-verify.sh chalta hai.
# Script ke andar ye 5 commands order me chalti hain, pehli failure par ruk jaati hain:
#   npm ci -> npm run lint (tsc --noEmit) -> npm test -> npm run lint:eslint -> npm run build
# Node version .nvmrc se aati hai (setup-node yahan `nvm use` ka kaam karta hai).
# Secrets ya asli Supabase credentials yahan use nahi hote (build ke liye script sirf dummy values deta hai).
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Verify (scripts/day28-verify.sh)
        run: bash scripts/day28-verify.sh
