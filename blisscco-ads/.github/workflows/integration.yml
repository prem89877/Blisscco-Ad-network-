name: DB integration (TEST database only)

# Haath se chalao (Actions > "DB integration" > Run workflow). Sirf alag TEST Supabase project par chalta hai, production par kabhi nahi.
# Repo secrets (TEST project ke): TEST_DATABASE_URL, TEST_SUPABASE_PROJECT_REF.
# Guard (tests/integration/test-db-guard.ts) in teeno me se kuch bhi galat ho toh test chalne se pehle hi roak deta hai.
on:
  workflow_dispatch:

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Install
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            echo "::warning title=package-lock.json missing::npm install fallback (not reproducible)"
            npm install
          fi
      - name: Integration tests (TEST database)
        run: npm run test:integration
        env:
          TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
          TEST_SUPABASE_PROJECT_REF: ${{ secrets.TEST_SUPABASE_PROJECT_REF }}
          TEST_DB_CONFIRM: blisscco-test-db
